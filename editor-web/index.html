<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RichTextEditor</title>
  </head>
  <style>
    body {
      margin: 0;
      padding: 0;
      /* Base font styles - themes might override */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    #root > div:nth-of-type(1) {
      position: absolute;
      height: 100%;
      overflow: auto;
      width: 100%;
      top: 0;
      bottom: 0;
    }
    #root > div.dynamic-height {
      height: unset;
    }

    #root div .ProseMirror {
      height: 100%;
      overflow: auto;
      padding: 10px; /* Add padding to ProseMirror */
      outline: none;
    }
    #root div.dynamic-height .ProseMirror {
      height: unset;
    }
    .ProseMirror:focus {
      outline: none;
    }
    
    /* Base blockquote styling (themes can override) */
    blockquote {
      border-left: 3px solid #CCC;
      padding-left: 10px;
      margin-left: 20px;
      color: #666;
    }

    /* --- Bible Verse NodeView Styling --- */
    .bible-verse-block {
      margin: 10px 0;
      border: 1px solid rgba(135, 169, 107, 0.3); /* Use a neutral border color */
      border-radius: 8px;
      overflow: hidden;
      background-color: rgba(135, 169, 107, 0.05); /* Subtle background */
    }
    .bible-verse-header {
      padding: 8px 12px;
      background-color: rgba(135, 169, 107, 0.1); /* Slightly darker header */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none; /* Prevent text selection on header */
    }
    .bible-verse-reference {
      font-weight: bold;
      /* Color will be inherited or set by theme CSS */
    }
    .bible-verse-toggle {
      font-size: 14px; /* Slightly larger toggle */
      margin-left: 8px;
      transition: transform 0.3s ease-out;
      display: inline-block; /* Needed for transform */
       /* Color will be inherited or set by theme CSS */
    }
    .bible-verse-toggle.expanded {
      transform: rotate(90deg);
    }
    .bible-verse-content {
      /* Transition and padding are handled by inline styles in the component */
      /* Verse formatting within the content */
    }
    .bible-verse-content p {
       margin: 0 0 4px 0; /* Adjust paragraph spacing */
    }
    .bible-verse-content strong {
      min-width: 20px; /* Ensure space for verse numbers */
      margin-right: 8px;
      display: inline-block; /* Needed for min-width */
      /* Color will be inherited or set by theme CSS */
    }
    /* --- End Bible Verse Styling --- */

    .highlight-background {
      background-color: #e6e6ff;
    }
  </style>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
